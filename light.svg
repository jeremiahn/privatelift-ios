<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lightBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="logoDarkText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#lightBgGrad)" />

  <g filter="url(#lightShadow)" transform="translate(90, 126)">
    
    <path d="M 0,0 
             L 130,0 
             C 180,0 200,30 200,75 
             C 200,120 180,150 130,150 
             L 65,150 
             L 65,260 
             L 0,260 
             Z" 
          fill="url(#logoDarkText)" />
    
    <path d="M 65,55 
             L 120,55 
             C 140,55 140,95 120,95 
             L 65,95 
             Z" 
          fill="#f8fafc" />

    <path d="M 185,0 
             L 250,0 
             L 250,210 
             L 355,210 
             L 355,260 
             L 185,260 
             Z" 
          fill="url(#logoBlue)" />
  </g>
</svg>
